<html lang="zh-CN">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账户资产曲线</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  .header {
    text-align: center;
    margin-bottom: 16px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }
  .header .subtitle {
    font-size: 13px;
    color: #888;
  }
  .stats-bar {
    display: flex;
    gap: 24px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat-card {
    background: #1a1d27;
    border: 1px solid #2a2d37;
    border-radius: 8px;
    padding: 12px 20px;
    text-align: center;
    min-width: 120px;
  }
  .stat-card .label {
    font-size: 11px;
    color: #888;
    margin-bottom: 4px;
  }
  .stat-card .value {
    font-size: 20px;
    font-weight: 700;
  }
  .stat-card .value.green { color: #00d68f; }
  .stat-card .value.red { color: #ff5252; }
  .stat-card .value.white { color: #fff; }
  .chart-container {
    width: 100%;
    max-width: 1200px;
    background: #1a1d27;
    border: 1px solid #2a2d37;
    border-radius: 12px;
    padding: 20px;
    position: relative;
    height: 480px;
  }
  .footer {
    margin-top: 12px;
    font-size: 11px;
    color: #555;
  }
</style>
</head>
<body>
<div class="header">
  <h1>账户资产曲线</h1>
  <div class="subtitle">2026-03-26 ~ 2026-07-15 · 初始资金 ¥100,000</div>
</div>
<div class="stats-bar">
  <div class="stat-card">
    <div class="label">当前总资产</div>

  </div>
  <div class="stat-card">

  <div class="stat-card">

  <div class="stat-card">

<div class="chart-container">

</div>

const ctx = document.getElementById('accountChart').getContext('2d');

// 渐变色
const gradient = ctx.createLinearGradient(0, 0, 0, 400);
gradient.addColorStop(0, 'rgba(0, 214, 143, 0.25)');
gradient.addColorStop(1, 'rgba(0, 214, 143, 0)');

// 找最高点
const maxValue = Math.max(...data.map(d => d.value));
const maxIndex = data.findIndex(d => d.value === maxValue);

const chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: data.map(d => d.date),
    datasets: [{
      label: '总资产',
      data: data.map(d => d.value),
      borderColor: '#00d68f',
      backgroundColor: gradient,

    plugins: {

        cornerRadius: 8,
        callbacks: {
          title: (items) => '日期: ' + items[0].label,
          label: (item) => {

            const ret = ((val - 100000) / 100000 * 100).toFixed(2);
            return [
              '总资产: ¥' + val.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2}),

            ];
          }
        }
      },
      annotation: {

          baseline: {

            xValue: maxIndex,
            yValue: maxValue,
            backgroundColor: 'rgba(255, 204, 0, 0.8)',
            borderColor: '#ffcc00',
            borderWidth: 2,
            radius: 6,
          },
          peakLabel: {
            type: 'label',
            xValue: maxIndex,
            yValue: maxValue,
            content: ['最高点', '¥' + maxValue.toLocaleString('zh-CN')],

            font: { size: 11, weight: 'bold' },
            position: { x: 'center', y: 'end' },

            backgroundColor: 'transparent',
          }
        }
      }

          color: '#666',
          font: { size: 10 },
          maxRotation: 45,
          minRotation: 45,
          autoSkip: true,
          maxTicksLimit: 20,
        }

      y: {
        grid: { color: 'rgba(255,255,255,0.05)' },

          color: '#666',
          font: { size: 11 },

        },

</body>
</html>
