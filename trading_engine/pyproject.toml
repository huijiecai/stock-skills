[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-trading-engine"
version = "0.1.0"
description = "Replay-first AI trading engine for the stock workspace"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
    "typer>=0.16,<1",
]

[project.scripts]
trader = "trading_engine.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trading_engine"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
